<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background with smooth rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="210" fill="url(#glowGrad)"/>
  <!-- Decorative traditional inner circle -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#sealGrad)" stroke-width="5" stroke-opacity="0.5" stroke-dasharray="10 8"/>
  <!-- Japanese Hanko / Seal Badge -->
  <rect x="96" y="96" width="320" height="320" rx="72" fill="url(#sealGrad)" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.5))"/>
  <rect x="110" y="110" width="292" height="292" rx="58" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.35"/>
  <!-- Kanji Character 漢 -->
  <text x="256" y="260" font-family="'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif" font-size="200" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="central">漢</text>
  <!-- Gold brush accent -->
  <circle cx="360" cy="150" r="10" fill="#fbbf24"/>
</svg>
